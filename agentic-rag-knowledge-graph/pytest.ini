[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as async
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:.*coroutine.*was never awaited
    ignore::RuntimeWarning:.*Neo4jDriver\.execute_query.*was never awaited
    ignore::RuntimeWarning:.*semaphore_gather.*was never awaited
    ignore::RuntimeWarning:.*_wrap_coroutine.*was never awaited
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning:.*Event loop is closed
    ignore:.*Event loop is closed:RuntimeError
    ignore:.*coroutine.*GeneratorExit:RuntimeWarning
    ignore:.*Exception ignored in.*graphiti_core:pytest.PytestUnraisableExceptionWarning
asyncio_mode = auto